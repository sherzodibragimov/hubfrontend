server {
  listen 80;
  absolute_redirect off;
  root /usr/share/nginx/html;
  client_max_body_size 1100m;
  proxy_request_buffering off;
  proxy_read_timeout 600s;
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  server_tokens off;

  # Xavfsizlik sarlavhalari (location ichida add_header bo‘lsa — u yerda takrorlanadi)
  set $csp "default-src 'self'; script-src 'self' https://challenges.cloudflare.com; frame-src https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' blob: https:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'";
  add_header Content-Security-Policy $csp always;
  add_header X-Frame-Options DENY always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

  location /api/ { proxy_pass http://${API_UPSTREAM}; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Real-IP $http_x_real_ip; }
  location /media/ { proxy_pass http://${API_UPSTREAM}; expires 7d; }
  # Eski Django admin manzillari → panel sozlamalari
  location ~ ^/(admin|catalog-ui)(/|$) { return 302 /settings; }
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    add_header Content-Security-Policy $csp always;
    add_header X-Content-Type-Options nosniff always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  }
  location / { try_files $uri /index.html; }
}
