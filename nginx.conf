server {
  listen 80;
  root /usr/share/nginx/html;
  client_max_body_size 1100m;
  proxy_request_buffering off;
  proxy_read_timeout 600s;
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  location /api/ { proxy_pass http://${API_UPSTREAM}; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
  location /media/ { proxy_pass http://${API_UPSTREAM}; expires 7d; }
  # Django (eski admin) — /internal/ ataylab tashqariga ochilmaydi
  location ~ ^/(admin|static|catalog-ui)/ { proxy_pass http://${DJANGO_UPSTREAM}; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto; }
  location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; }
  location / { try_files $uri /index.html; }
}
